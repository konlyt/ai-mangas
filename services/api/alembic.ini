# Alembic config.
# NOTE: keep this file ASCII-only. Alembic reads the ini with the system
# locale codec (GBK on zh-CN Windows), so non-ASCII bytes break parsing.
# sqlalchemy.url is a placeholder only: env.py overrides it at runtime via
# Settings.get_database_url (.env), swapping asyncmy for the pymysql driver.

[alembic]
script_location = alembic
prepend_sys_path = .
# MySQL connection from .env (sync driver), see env.py for the real value
sqlalchemy.url = mysql+pymysql://root:123456@localhost:3306/AnimeWorld?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
